[build-system]
requires = ["setuptools>=64", "pybind11>=2.10", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-spatial"
version = "0.1.0"
description = "PACE: proximity-associated changes in expression, for imaging spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Elijah Willie" }]
keywords = ["spatial transcriptomics", "single cell", "Xenium", "CosMx",
            "cell-cell interaction", "mixed models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# scipy carries the sparse matrices every stage reads; numpy everything else.
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
# pandas only for the .to_dataframe() views, anndata only for fit_anndata(),
# matplotlib only to draw. None of the three is needed to fit.
tables = ["pandas>=1.3"]
anndata = ["anndata>=0.8"]
plot = ["matplotlib>=3.5"]
test = ["pytest", "pandas>=1.3", "anndata>=0.8", "matplotlib>=3.5"]
all = ["pandas>=1.3", "anndata>=0.8", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/ecool50/PACE"
Source = "https://github.com/ecool50/PACE"
Issues = "https://github.com/ecool50/PACE/issues"

[tool.setuptools]
packages = ["pace"]

[tool.setuptools.package-data]
pace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
